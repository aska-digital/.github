# Every public aska-digital repository: its custom properties and its topics, under the labelling standard
# (LABELS-STANDARD.md). `sync.py repos plan` shows what differs on GitHub; `repos apply` sets it. Owners only.
# This file is in a public repository, so it lists public repositories only. Private ones are listed
# in aska-digital/internal-stoa: .github/labels/repos.private.toml (run sync.py with --repos pointing at it).

version = 1
org = "aska-digital"
required_topics = ["aska-digital"]

[properties.kind]
type = "multi_select"
values = ["org-home", "core", "product", "ingredient", "plugin", "tool", "personal", "ops", "client", "fork", "archive"]
description = "What the repository is"

[properties.domain]
type = "multi_select"
values = ["protean", "hermes-plugins", "omarchy", "developer-tools", "agent-protocol", "crm", "go-to-market"]
description = "The product family or field"

[properties.stage]
type = "single_select"
values = ["experimental", "active", "stable", "paused", "retired"]
description = "How far along it is"

[properties.board]
type = "single_select"
values = ["main", "internal", "project", "none"]
description = "Its discussion board under the forum standard"

[properties.owner]
type = "string"
description = "The person or team who answers for it"

